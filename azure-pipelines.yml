# Starter pipeline
# Start with a minimal pipeline that you can customize to build and deploy your code.
# Add steps that build, run tests, deploy, and more:
# https://aka.ms/yaml

trigger:
- dev

pool:
  vmImage: ubuntu-latest

variables:
- name: imagetag
  value: '$(Build.BuildId)'

steps:
- task: DockerCompose@1
  displayName: "Build Docker Compose"
  inputs:
    containerregistrytype: 'Azure Container Registry'
    azureSubscription: 'Pay-As-You-Go(e3ce4f58-a3c4-4faa-a2a6-3e2c140c20fb)'
    azureContainerRegistry: '{"loginServer":"creditflowacr.azurecr.io", "id" : "/subscriptions/e3ce4f58-a3c4-4faa-a2a6-3e2c140c20fb/resourceGroups/TecylabCreditFlow/providers/Microsoft.ContainerRegistry/registries/creditflowacr"}'
    dockerComposeFile: '**/docker-compose.yml'
    projectName: 'creditproductsapi'
    qualifyImageNames: true

    dockerComposeFileArgs: |
     DOCKER_REGISTRY=creditflowacr.azurecr.io/
     
    action: 'Build services'

    additionalImageTags: |
      $(imagetag)
   
    includeLatestTag: true

- task: DockerCompose@1
  displayName: "Push Docker Compose to ACR"
  inputs:
    containerregistrytype: 'Azure Container Registry'
    azureSubscription: 'Pay-As-You-Go(e3ce4f58-a3c4-4faa-a2a6-3e2c140c20fb)'
    azureContainerRegistry: '{"loginServer":"creditflowacr.azurecr.io", "id" : "/subscriptions/e3ce4f58-a3c4-4faa-a2a6-3e2c140c20fb/resourceGroups/TecylabCreditFlow/providers/Microsoft.ContainerRegistry/registries/creditflowacr"}'
    dockerComposeFile: '**/docker-compose.yml'
    projectName: 'creditproductsapi'
    action: 'Push services'

    qualifyImageNames: true

    dockerComposeFileArgs: |
     DOCKER_REGISTRY=creditflowacr.azurecr.io/
    
    additionalImageTags: |
      $(imagetag)
   
    includeLatestTag: true